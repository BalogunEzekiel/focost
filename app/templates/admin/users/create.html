{% extends "layouts/dashboard.html" %}

{% block title %}Create User{% endblock %}

{% block content %}

<div class="container-fluid">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">

                    <h4 class="mb-0">
                        <i class="bi bi-person-plus-fill me-2"></i>
                        Create User
                    </h4>

                </div>

                <div class="card-body">

                    <form method="POST">

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    First Name
                                </label>

                                <input
                                    type="text"
                                    name="first_name"
                                    class="form-control"
                                    required>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Last Name
                                </label>

                                <input
                                    type="text"
                                    name="last_name"
                                    class="form-control"
                                    required>

                            </div>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Email

                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Password

                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                required>

                        </div>

                        <div class="mb-4">

                            <label class="form-label">

                                Role

                            </label>

                            <select
                                name="role"
                                class="form-select">

                                <option value="">
                                    No Role
                                </option>

                                {% for role in roles %}

                                <option value="{{ role.slug }}">

                                    {{ role.name }}

                                </option>

                                {% endfor %}

                            </select>

                        </div>

                        <div class="d-flex justify-content-between">

                            <a
                                href="{{ url_for('admin_users.index') }}"
                                class="btn btn-secondary">

                                Back

                            </a>

                            <button
                                class="btn btn-primary">

                                <i class="bi bi-check-lg me-2"></i>

                                Create User

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
