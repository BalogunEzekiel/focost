{% extends "layouts/dashboard.html" %}

{% block title %}Edit User{% endblock %}

{% block content %}

<div class="container-fluid">

<div class="row justify-content-center">

<div class="col-lg-8">

<div class="card shadow">

<div class="card-header bg-warning">

<h4>

Edit User

</h4>

</div>

<div class="card-body">

<form method="POST">

<div class="row">

<div class="col-md-6 mb-3">

<label>

First Name

</label>

<input
class="form-control"
name="first_name"
value="{{ user.first_name }}">

</div>

<div class="col-md-6 mb-3">

<label>

Last Name

</label>

<input
class="form-control"
name="last_name"
value="{{ user.last_name }}">

</div>

</div>

<div class="mb-3">

<label>

Email

</label>

<input
class="form-control"
name="email"
value="{{ user.email }}">

</div>

<div class="mb-3">

<label>

New Password

</label>

<input
type="password"
class="form-control"
name="password">

<small class="text-muted">

Leave blank to keep current password.

</small>

</div>

<div class="d-flex justify-content-between">

<a
href="{{ url_for('admin_users.details',public_id=user.public_id) }}"
class="btn btn-secondary">

Cancel

</a>

<button
class="btn btn-warning">

Save Changes

</button>

</div>

</form>

</div>

</div>

</div>

</div>

</div>

{% endblock %}
