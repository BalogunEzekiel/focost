<!-- =======================================================
     PAGE SUMMARY
======================================================= -->
<div class="row align-items-center g-2 mb-3">

    <!-- Welcome -->
    <div class="col-lg-8 col-md-7">

        <h4 class="fw-bold mb-0">
            Welcome back, {{ current_user.first_name }} 👋
        </h4>

        <small class="text-muted">
            Here is your financial overview for today.
        </small>

    </div>

    <!-- Summary Card -->
    <div class="col-lg-4 col-md-5">

        <div class="card border-0 shadow-sm rounded-3">

            <div class="card-body p-2">

                <!-- Header -->
                <div class="d-flex justify-content-between align-items-center mb-2">

                    <div class="lh-sm">

                        <small class="text-muted d-block" style="font-size:.65rem;">
                            Today
                        </small>

                        <span class="fw-semibold" style="font-size:.78rem;">
                            {{ dashboard.today }}
                        </span>

                    </div>

                    <span class="badge bg-primary px-2 py-1 small">
                        {{ dashboard.financial_status }}
                    </span>

                </div>

                <!-- Divider -->
                <hr class="my-2">

                <!-- Metrics -->
                <div class="d-flex justify-content-between text-center">

                    <div class="flex-fill">

                        <small class="text-muted d-block" style="font-size:.60rem;">
                            Health
                        </small>

                        <div class="fw-bold text-success" style="font-size:.82rem;">
                            {{ dashboard.health_score }}
                        </div>

                    </div>

                    <div class="flex-fill">

                        <small class="text-muted d-block" style="font-size:.60rem;">
                            Savings
                        </small>

                        <div class="fw-bold text-primary" style="font-size:.82rem;">
                            {{ dashboard.savings_rate }}%
                        </div>

                    </div>

                    <div class="flex-fill">

                        <small class="text-muted d-block" style="font-size:.60rem;">
                            Goals
                        </small>

                        <div class="fw-bold text-warning" style="font-size:.82rem;">
                            {{ dashboard.active_goals }}
                        </div>

                    </div>

                    <div class="flex-fill">

                        <small class="text-muted d-block" style="font-size:.60rem;">
                            Budgets
                        </small>

                        <div class="fw-bold text-info" style="font-size:.82rem;">
                            {{ dashboard.active_budgets }}
                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>
