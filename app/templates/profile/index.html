{% extends "layouts/dashboard.html" %}
{% block title %}My Profile{% endblock %}
{% block content %}
<div class="container-fluid py-4"><div class="row justify-content-center"><div class="col-xl-8"><div class="card border-0 shadow-sm"><div class="card-body p-4">
<h3 class="fw-bold mb-4">My Profile</h3>
<form method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="row g-3">
<div class="col-md-6"><label class="form-label">First name</label><input class="form-control" name="first_name" value="{{ current_user.first_name }}" required></div>
<div class="col-md-6"><label class="form-label">Last name</label><input class="form-control" name="last_name" value="{{ current_user.last_name }}" required></div>
<div class="col-md-6"><label class="form-label">Email</label><input class="form-control" value="{{ current_user.email }}" disabled></div>
<div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" name="phone" value="{{ current_user.phone or '' }}"></div>
<div class="col-md-6"><label class="form-label">Country</label><input class="form-control" name="country" value="{{ current_user.country or '' }}"></div>
<div class="col-md-6"><label class="form-label">Currency</label><input class="form-control" name="currency" value="{{ current_user.currency or 'NGN' }}"></div>
<div class="col-md-6"><label class="form-label">Occupation</label><input class="form-control" name="occupation" value="{{ current_user.occupation or '' }}"></div>
<div class="col-md-6"><label class="form-label">Profile picture</label><input class="form-control" type="file" name="avatar" accept="image/png,image/jpeg,image/webp"></div>
</div><button class="btn btn-primary mt-4">Save Profile</button></form>
</div></div></div></div></div>
{% endblock %}
